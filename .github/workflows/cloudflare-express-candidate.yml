name: Cloudflare Express candidate
on:
  push:
    branches: [experiment/cloudflare-backend]
    paths:
      - 'experiments/cloudflare-backend/candidate/**'
      - 'cloudflare/**'
      - 'server/**'
      - 'prisma/**'
      - 'tests/notification-mail.test.mjs'
      - 'tests/cloudflare-preview.test.mjs'
      - '.github/workflows/cloudflare-express-candidate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/cloudflare-backend/candidate/**'
      - 'cloudflare/**'
      - 'server/**'
      - 'prisma/**'
      - 'tests/notification-mail.test.mjs'
      - 'tests/cloudflare-preview.test.mjs'
      - '.github/workflows/cloudflare-express-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ucfr_test
          POSTGRES_PASSWORD: ucfr_test
          POSTGRES_DB: ucfr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ucfr_test -d ucfr_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ucfr_test:ucfr_test@127.0.0.1:5432/ucfr_test
      - name: Prepare synthetic database only
        env:
          DATABASE_URL: postgresql://ucfr_test:ucfr_test@127.0.0.1:5432/ucfr_test
        run: |
          npm run db:push
          node --input-type=module <<'NODE'
          import { PrismaClient } from '@prisma/client';
          import { PrismaPg } from '@prisma/adapter-pg';
          import bcrypt from 'bcryptjs';
          import { readFile } from 'node:fs/promises';
          const prisma=new PrismaClient({adapter:new PrismaPg({connectionString:process.env.DATABASE_URL})});
          const passwordHash=await bcrypt.hash('ucfr-ci-test-only',12);
          await prisma.user.create({data:{email:'member@example.invalid',firstName:'Synthetic',lastName:'Member',passwordHash,role:'MEMBER',membershipStatus:'APPROVED'}});
          await prisma.user.create({data:{email:'admin@example.invalid',firstName:'Synthetic',lastName:'Admin',passwordHash,role:'ADMIN',membershipStatus:'APPROVED'}});
          await prisma.user.create({data:{email:'other@example.invalid',firstName:'Other',lastName:'Member',passwordHash,role:'MEMBER',membershipStatus:'APPROVED'}});
          await prisma.$executeRawUnsafe(await readFile('experiments/cloudflare-backend/candidate/storage.sql','utf8'));
          await prisma.$executeRawUnsafe(await readFile('experiments/cloudflare-backend/candidate/password.sql','utf8'));
          const resetSchema = await readFile('cloudflare/reset-window.sql','utf8');
          for (const statement of resetSchema.split(';').filter(sql => sql.trim())) await prisma.$executeRawUnsafe(statement);
          await prisma.$disconnect();
          NODE
      - run: npm ci --prefix experiments/cloudflare-backend --no-audit --no-fund
      - run: node --test tests/notification-mail.test.mjs tests/cloudflare-preview.test.mjs
      - run: npm run build
      - run: node experiments/cloudflare-backend/candidate/prepare.mjs
      - name: Bundle and check size without deploying
        working-directory: experiments/cloudflare-backend
        run: npx wrangler deploy --config candidate/wrangler.jsonc --dry-run --outdir candidate/.wrangler/dry-run
      - name: Test local Workers runtime with isolated synthetic PostgreSQL
        working-directory: experiments/cloudflare-backend
        run: |
          cat > candidate/.dev.vars <<'EOF'
          CANDIDATE_ACCESS_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CANDIDATE_SESSION_SECRET=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          CANDIDATE_DATABASE_URL=postgresql://ucfr_test:ucfr_test@127.0.0.1:5432/ucfr_test
          CANDIDATE_DATABASE_HOST=127.0.0.1
          CANDIDATE_CI_WRITES=true
          CANDIDATE_DB_BCRYPT=true
          CANDIDATE_CI_MAIL=true
          EOF
          node candidate/mail-fixture.mjs > /tmp/ucfr-mail.log 2>&1 &
          mailpid=$!
          npx wrangler dev --config candidate/wrangler.jsonc --local --port 8789 > /tmp/ucfr-candidate.log 2>&1 &
          pid=$!
          trap 'kill "$pid" "$mailpid" || true; cat /tmp/ucfr-candidate.log; rm -f candidate/.dev.vars' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8789/health > /tmp/ucfr-health.json; then break; fi
            sleep 2
          done
          node -e "const r=require('/tmp/ucfr-health.json'); if(!r.ok||r.production!==false)process.exit(1)"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8789/api/auth/me)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-UCFR-Candidate-Token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' http://localhost:8789/api/auth/register)" = 405
          test "$(curl -s -o /tmp/ucfr-auth.json -w '%{http_code}' -H 'X-UCFR-Candidate-Token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' http://localhost:8789/api/auth/me)" = 401
          node -e "if(require('/tmp/ucfr-auth.json').error!=='Unauthorized')process.exit(1)"
          node candidate/integration.mjs
      - name: Test the combined Worker with the disposable database
        run: |
          cat > cloudflare/.dev.vars <<'EOF'
          TOKEN_SECRET=rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr
          UCFR_PREVIEW_TOKEN=pppppppppppppppppppppppppppppppppppppppppppppppp
          DATABASE_URL=postgresql://ucfr_test:ucfr_test@127.0.0.1:5432/ucfr_test
          BREVO_API_KEY=synthetic-local-no-send
          EOF
          wrangler=experiments/cloudflare-backend/node_modules/.bin/wrangler
          "$wrangler" deploy --config cloudflare/wrangler.jsonc --dry-run
          "$wrangler" dev --config cloudflare/wrangler.jsonc --local --port 8791 > /tmp/ucfr-combined.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true; rm -f cloudflare/.dev.vars' EXIT
          for i in $(seq 1 30); do
            if curl -sS http://127.0.0.1:8791/api/edge-health -o /dev/null; then break; fi
            sleep 1
          done
          node cloudflare/test-local.mjs
      - name: Test the Git-connected preview with the same synthetic database
        working-directory: experiments/cloudflare-backend
        run: |
          cat > .dev.vars <<'EOF'
          TOKEN_SECRET=rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr
          UCFR_PREVIEW_TOKEN=pppppppppppppppppppppppppppppppppppppppppppppppp
          DATABASE_URL=postgresql://ucfr_test:ucfr_test@127.0.0.1:5432/ucfr_test
          BREVO_API_KEY=synthetic-local-no-send
          EOF
          npx wrangler dev --local --port 8788 > "$RUNNER_TEMP/ucfr-preview.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -f .dev.vars; cat "$RUNNER_TEMP/ucfr-preview.log"' EXIT
          curl -fsS --retry 40 --retry-all-errors --retry-delay 1 http://127.0.0.1:8788/health -o /dev/null
          node staging-smoke.mjs
          node ../../cloudflare/test-local.mjs staging
