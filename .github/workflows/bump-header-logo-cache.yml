name: bump-header-logo-cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh header logo script cache
        run: |
          sed -i 's#/header-logo-fix.js?v=1#/header-logo-fix.js?v=2#g' index.html
          git rm .github/workflows/bump-header-logo-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore original UČFR logo cache version'
          git push
