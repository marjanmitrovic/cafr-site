name: fix-logo-loop

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove conflicting logo script
        run: |
          sed -i '/header-logo-fix\.js/d' index.html
          sed -i 's#/ucfr-logo-runtime.js?v=16#/ucfr-logo-runtime.js?v=17#g' index.html
          if git diff --quiet -- index.html; then
            echo 'Already fixed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Stop logo reload loop'
          git push
