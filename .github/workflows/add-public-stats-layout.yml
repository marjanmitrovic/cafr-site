name: add-public-stats-layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Include public stats script
        run: |
          sed -i 's#/public-member-count.js?v=1#/public-member-count.js?v=2#g' index.html
          if ! grep -q 'public-stats-layout.js' index.html; then
            sed -i '/<script src="\/public-member-count.js?v=2" defer><\/script>/a\  <script src="/public-stats-layout.js?v=1" defer></script>' index.html
          fi
          if git diff --quiet -- index.html; then
            echo 'Already integrated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show districts and approved member count'
          git push
