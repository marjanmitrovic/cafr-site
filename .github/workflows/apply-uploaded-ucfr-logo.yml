name: Apply uploaded UČFR logo

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-uploaded-ucfr-logo.yml

permissions:
  contents: write

jobs:
  apply-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace active logo references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          new_logo = '/assets/ucfr-logo.svg?v=10'
          old_refs = [
              '/assets/ucfr-logo.png?v=5',
              '/assets/ucfr-logo.png?v=7',
              '/assets/ucfr-logo.svg?v=3',
              '/assets/ucfr-logo.svg',
          ]

          text_files = [
              root / 'index.html',
              root / 'src/main.js',
              root / 'public/member-card-system.js',
              root / 'public/ucfr-details.js',
              root / 'public/ucfr-brand.js',
              root / 'public/site.webmanifest',
              root / 'public/verify.html',
              root / 'public/reset-password.html',
              root / 'public/member.html',
          ]

          for path in text_files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for old in old_refs:
                  text = text.replace(old, new_logo)
              if path.name == 'site.webmanifest':
                  text = text.replace('"type": "image/png"', '"type": "image/svg+xml"')
              if path.name == 'index.html':
                  text = text.replace('type="image/png"', 'type="image/svg+xml"')
                  text = text.replace('/ucfr-details.css?v=7', '/ucfr-details.css?v=10')
                  text = text.replace('/ucfr-details.js?v=9', '/ucfr-details.js?v=10')
                  text = text.replace('/member-card-system.js"', '/member-card-system.js?v=10"')
              path.write_text(text, encoding='utf-8')

          css_path = root / 'public/ucfr-details.css'
          css = css_path.read_text(encoding='utf-8')
          marker = '/* uploaded-horizontal-logo */'
          if marker in css:
              css = css.split(marker)[0].rstrip() + '\n'
          css += '''

          /* uploaded-horizontal-logo */
          .brand {
            min-width: 290px;
          }

          .brand img[src*="ucfr-logo"] {
            width: 340px !important;
            height: auto !important;
            max-height: 104px;
            object-fit: contain;
            filter: none !important;
            background: #fff;
          }

          .brand > div {
            display: none !important;
          }

          .footer-brand img[src*="ucfr-logo"] {
            width: 300px !important;
            height: auto !important;
            max-width: 100%;
            background: #fff;
            border-radius: 0;
          }

          .member-card > img[src*="ucfr-logo"]:first-child {
            width: 240px !important;
            height: auto !important;
            max-width: 88%;
            border-radius: 8px;
          }

          @media (max-width: 720px) {
            .brand {
              min-width: 0;
              max-width: 230px;
            }

            .brand img[src*="ucfr-logo"] {
              width: 220px !important;
              max-height: 78px;
            }

            .footer-brand img[src*="ucfr-logo"] {
              width: 250px !important;
            }
          }
          '''
          css_path.write_text(css, encoding='utf-8')

          card_template = root / 'public/cards/card-template.svg'
          if card_template.exists():
              text = card_template.read_text(encoding='utf-8')
              text = text.replace(
                  '<image href="{{LOGO}}" x="45" y="20" width="142" height="194" preserveAspectRatio="xMidYMid meet"/>',
                  '<image href="{{LOGO}}" x="42" y="38" width="155" height="66" preserveAspectRatio="xMidYMid meet"/>'
              )
              card_template.write_text(text, encoding='utf-8')

          workflow = root / '.github/workflows/apply-uploaded-ucfr-logo.yml'
          workflow.unlink(missing_ok=True)
          PY

      - name: Commit final logo update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Use uploaded UČFR logo throughout site"
          git push
