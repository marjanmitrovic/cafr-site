name: Generate Cloudflare lab lockfile
on:
  push:
    branches: [experiment/cloudflare-backend]
    paths: ['.github/workflows/cloudflare-lab-lockfile.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    if: github.ref == 'refs/heads/experiment/cloudflare-backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/cloudflare-backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and verify lockfile
        working-directory: experiments/cloudflare-backend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm test
          npm run check
      - name: Commit verified lockfile to experimental branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/cloudflare-backend/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add verified npm lockfile for Cloudflare lab'
          git push origin HEAD:refs/heads/experiment/cloudflare-backend
