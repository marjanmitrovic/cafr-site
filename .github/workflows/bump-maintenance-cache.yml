name: bump-maintenance-cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump maintenance script version
        run: |
          sed -i 's#/maintenance-notice.js?v=3#/maintenance-notice.js?v=4#g' index.html
          if git diff --quiet -- index.html; then
            echo 'Already updated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bust cache for startup fix'
          git push
