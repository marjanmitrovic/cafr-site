name: Normalize UČFR logo paths

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ucfr-logo-paths.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize cache versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in {'.html', '.js', '.css', '.json', '.webmanifest', '.svg'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace('/assets/ucfr-logo.svg?v=10?v=10', '/assets/ucfr-logo.svg?v=10')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          Path('.github/workflows/fix-ucfr-logo-paths.yml').unlink(missing_ok=True)
          PY

      - name: Commit normalized paths
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize uploaded UČFR logo paths"
          git push
