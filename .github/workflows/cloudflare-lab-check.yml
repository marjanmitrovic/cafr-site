name: Cloudflare backend lab check
on:
  push:
    branches:
      - experiment/cloudflare-backend
    paths:
      - 'experiments/cloudflare-backend/**'
      - '.github/workflows/cloudflare-lab-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/cloudflare-backend/**'
      - '.github/workflows/cloudflare-lab-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/cloudflare-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
