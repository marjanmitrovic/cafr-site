      <p>UČFR propojuje aktivní i bývalé fotbalové rozhodčí, asistenty, videorozhodčí, delegáty a pozorovatele rozhodčích v celé České republice.</p>
      <p>Unie nabízí ochranu při incidentech, právní podporu, vzdělávání, mentoring, profesní komunitu a společné zastupování.</p>
      <p>IČO: 24417513</p>
      <p>Obecný kontakt: <a href="mailto:info@ucfr.cz">info@ucfr.cz</a><br>Média: <a href="mailto:media@ucfr.cz">media@ucfr.cz</a></p>
